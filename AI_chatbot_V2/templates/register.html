<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - MusicAI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        🎵 MusicAI
    </div>

    <div id="chat-box"
         class="chat-box">

        <div class="bot-message">
            Hello! I'm MusicAI. 🎵
        </div>

        <div class="bot-message">
            Before we begin, I'd like to know a little about you.
            What is your name?
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="user-input"
            placeholder="Type your answer..."
            autocomplete="off"
        >

        <button id="send-button">
            Send
        </button>

    </div>

</div>

<script src="{{ url_for('static', filename='js/register.js') }}">
</script>

</body>
</html>
