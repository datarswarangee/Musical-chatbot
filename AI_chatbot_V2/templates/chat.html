<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MusicAI Chat</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="chat-container">

    <div class="chat-header">

        <span>🎵 MusicAI</span>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>


    <div id="chat-box"
         class="chat-box">

        <div class="bot-message">
            {{ welcome_message }}
        </div>

        <div class="bot-message">
            What kind of music would you like to listen to?
        </div>


        <div class="category-container">

            {% for category in categories %}

            <button
                class="category-button"
                onclick="getRecommendations(
                    '{{ category["category_name"] }}'
                )">

                {{ category["category_name"] }}

            </button>

            {% endfor %}

        </div>


        <div class="chat-input-container">

            <input
                type="text"
                id="chat-input"
                placeholder="Type your music preference..."
                autocomplete="off"
            >

            <button
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>

    </div>

</div>


<script>


/* =====================================================
   GET RECOMMENDATIONS FROM CATEGORY BUTTON
   ===================================================== */

async function getRecommendations(category) {

    const chatBox =
        document.getElementById("chat-box");


    const userMessage =
        document.createElement("div");


    userMessage.className =
        "user-message";


    userMessage.textContent =
        category;


    chatBox.appendChild(
        userMessage
    );


    const response =
        await fetch(
            "/recommend",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    category: category
                })
            }
        );


    const result =
        await response.json();


    if (!result.success) {

        const errorMessage =
            document.createElement("div");

        errorMessage.className =
            "bot-message";

        errorMessage.textContent =
            result.message ||
            "Something went wrong.";

        chatBox.appendChild(
            errorMessage
        );

        chatBox.scrollTop =
            chatBox.scrollHeight;

        return;
    }


    const botMessage =
        document.createElement("div");


    botMessage.className =
        "bot-message";


    botMessage.textContent =
        result.message;


    chatBox.appendChild(
        botMessage
    );


    displaySongs(
        result.songs,
        chatBox
    );


    chatBox.scrollTop =
        chatBox.scrollHeight;
}


/* =====================================================
   DISPLAY SONG RECOMMENDATIONS
   ===================================================== */

function displaySongs(
    songs,
    chatBox
) {

    if (!songs || songs.length === 0) {

        const noSongsMessage =
            document.createElement("div");

        noSongsMessage.className =
            "bot-message";

        noSongsMessage.textContent =
            "I couldn't find any songs for this category.";

        chatBox.appendChild(
            noSongsMessage
        );

        return;
    }


    songs.forEach(
        song => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "song-card";


            card.innerHTML = `

                <div>

                    <strong>
                        ${song.title}
                    </strong>

                    <br>

                    <span>
                        ${song.artist}
                        ${
                            song.year
                            ? " • " + song.year
                            : ""
                        }
                    </span>

                </div>


                <div class="song-actions">

                    <button
                        onclick="
                            recordAction(
                                ${song.id},
                                'liked'
                            )
                        "
                        title="Like"
                    >
                        ❤️
                    </button>


                    <button
                        onclick="
                            recordAction(
                                ${song.id},
                                'skipped'
                            )
                        "
                        title="Skip"
                    >
                        ✕
                    </button>

                </div>

            `;


            chatBox.appendChild(
                card
            );

        }
    );
}


/* =====================================================
   RECORD LIKE / SKIP
   ===================================================== */

async function recordAction(
    songId,
    action
) {

    try {

        const response =
            await fetch(
                "/history",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        song_id: songId,
                        action: action
                    })
                }
            );


        const result =
            await response.json();


        if (!result.success) {

            console.error(
                "Could not save action."
            );

        }

    } catch (error) {

        console.error(
            "History error:",
            error
        );

    }
}


/* =====================================================
   SEND NATURAL LANGUAGE MESSAGE
   ===================================================== */

async function sendMessage() {

    const input =
        document.getElementById(
            "chat-input"
        );


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    const chatBox =
        document.getElementById(
            "chat-box"
        );


    /* ---------------------------------------------
       Display user's message
       --------------------------------------------- */

    const userMessage =
        document.createElement(
            "div"
        );


    userMessage.className =
        "user-message";


    userMessage.textContent =
        message;


    chatBox.appendChild(
        userMessage
    );


    input.value = "";


    /* ---------------------------------------------
       Send message to Flask
       --------------------------------------------- */

    try {

        const response =
            await fetch(
                "/chat_message",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })
                }
            );


        const result =
            await response.json();


        /* -----------------------------------------
           Bot response
           ----------------------------------------- */

        const botMessage =
            document.createElement(
                "div"
            );


        botMessage.className =
            "bot-message";


        botMessage.textContent =
            result.message ||
            "I'm sorry, something went wrong.";


        chatBox.appendChild(
            botMessage
        );


        /* -----------------------------------------
           Display recommendations
           ----------------------------------------- */

        if (
            result.success &&
            result.detected &&
            result.songs
        ) {

            displaySongs(
                result.songs,
                chatBox
            );

        }


    } catch (error) {

        const errorMessage =
            document.createElement(
                "div"
            );


        errorMessage.className =
            "bot-message";


        errorMessage.textContent =
            "Sorry, I couldn't connect to the server.";


        chatBox.appendChild(
            errorMessage
        );


        console.error(
            "Chat error:",
            error
        );

    }


    chatBox.scrollTop =
        chatBox.scrollHeight;
}


/* =====================================================
   PRESS ENTER TO SEND
   ===================================================== */

document
    .getElementById("chat-input")
    .addEventListener(
        "keypress",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendMessage();

            }

        }
    );


</script>

</body>

</html>
